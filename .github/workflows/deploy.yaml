# Name of the workflow (appears in GitHub Actions tab)
name: Deploy Frontend to EC2

# ============================================
# TRIGGERS
# ============================================
# When should this workflow run?
on:
  # Run when code is pushed to main branch
  push:
    branches:
      - main
  
  # Also allow manual triggering from GitHub UI
  workflow_dispatch:

# ============================================
# JOBS
# ============================================
jobs:
  # Job name
  build-and-deploy:
    # Run on Ubuntu (GitHub's virtual machine)
    runs-on: ubuntu-latest
    
    # ============================================
    # STEPS
    # ============================================
    steps:
      # --------------------------------------------
      # STEP 1: Check out the code
      # --------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        # This downloads your repository code to the runner
      
      # --------------------------------------------
      # STEP 2: Set up Docker Buildx
      # --------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx is an extended build tool with better caching
      
      # --------------------------------------------
      # STEP 3: Build the Docker image
      # --------------------------------------------
      - name: Build Docker image
        run: |
          # Build the image and tag it
          docker build -t frontend:latest .
          
          # Save the image as a tar file for transfer
          docker save frontend:latest > frontend.tar
        # This runs the docker build command using your Dockerfile
      
      # --------------------------------------------
      # STEP 4: Copy the image to EC2
      # --------------------------------------------
      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend.tar"
          target: "/home/ubuntu/app/"
        # SCP (Secure Copy) transfers files over SSH
      
      # --------------------------------------------
      # STEP 5: Deploy on EC2
      # --------------------------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Navigate to app directory
            cd /home/ubuntu/app
            
            # Load the Docker image from the tar file
            docker load < frontend.tar
            
            # Remove the tar file to save space
            rm frontend.tar
            
            # Stop and remove the old container (if exists)
            docker stop frontend || true
            docker rm frontend || true
            
            # Start the updated stack using docker-compose
            docker-compose up -d frontend
            
            # Clean up old, unused images to save disk space
            docker image prune -f
            
            # Show running containers for verification
            docker ps
        # This SSH into EC2 and runs deployment commands
      
      # --------------------------------------------
      # STEP 6: Health check
      # --------------------------------------------
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Wait for container to start
            sleep 10
            
            # Check if frontend container is running
            if docker ps | grep -q frontend; then
              echo " Frontend container is running!"
            else
              echo " Frontend container failed to start"
              docker logs frontend
              exit 1
            fi