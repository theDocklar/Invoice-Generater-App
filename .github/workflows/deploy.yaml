name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------
      # STEP 1: Checkout code
      # --------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------
      # STEP 2: Set up Docker Buildx
      # --------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------
      # STEP 3: Build Docker image
      # --------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t frontend:latest .
          docker save frontend:latest | gzip > frontend.tar.gz

      # --------------------------------------------
      # STEP 4: Copy image to EC2
      # --------------------------------------------
      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend.tar.gz"
          target: "/home/ubuntu/app/"

      # --------------------------------------------
      # STEP 5: Deploy on EC2
      # --------------------------------------------
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            
            # Load the new image
            gunzip -c frontend.tar.gz | docker load
            rm frontend.tar.gz
            
            # Check if backend exists, if not just start frontend
            if docker images | grep -q "backend"; then
              echo "Backend image exists, starting full stack..."
              docker-compose up -d
            else
              echo "Backend not yet deployed, starting frontend only..."
              docker-compose up -d frontend || docker run -d --name frontend -p 3000:80 frontend:latest
            fi
            
            # Clean up old images
            docker image prune -f
            
            # Show status
            docker ps

      # --------------------------------------------
      # STEP 6: Verify
      # --------------------------------------------
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_ }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sleep 5
            if docker ps | grep -q frontend; then
              echo "✅ Frontend is running!"
            else
              echo "❌ Frontend failed to start"
              docker logs frontend 2>&1 || true
              exit 1
            fi